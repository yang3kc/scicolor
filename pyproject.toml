[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scicolor"
version = "1.1"
description = "Collections of color maps for scientific visualizations"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kaicheng Yang", email = "yangkc@iu.edu" }
]
requires-python = ">=3.8"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/yangkcatiu/scicolor"
Repository = "https://github.com/yangkcatiu/scicolor"

[tool.hatch.build.targets.wheel]
packages = ["scicolor"]

[tool.hatch.build.targets.sdist]
include = [
    "scicolor/**/*.py",
    "scicolor/cet_colors/*.txt",
    "scicolor/ocean_colors/*.txt",
    "scicolor/scientific_colors/*.txt",
]
